<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Whiteboard Studio</title><style>body{background:#172337;color:#f4f0e5;font:17px system-ui;margin:30px auto;max-width:1250px;padding:18px}h1{font-size:44px}button,select,input{font:inherit;margin:5px;padding:8px;border-radius:5px}button{cursor:pointer;background:#b8e1ca;border:0}canvas{background:white;width:100%;touch-action:none;border-radius:12px}#status{min-height:24px}small{color:#a8c1d7}</style>
<small>DRAW · LAYER · KEEP IT LOCAL</small><h1>Room for an idea.</h1>
<label>Tool <select id="tool"><option>pen</option><option>line</option><option>rect</option></select></label><label>Ink <input id="color" type="color" value="#164e63"></label><label>Width <input id="width" type="range" min="1" max="30" value="4"></label><button id="undo">Undo</button><button id="redo">Redo</button>
<br><label>Layer <select id="layers"></select></label><button id="add">Add layer</button><button id="toggle">Show / hide layer</button><button id="remove">Delete layer</button><button id="clear">Clear layer</button>
<br><button id="save">Save in browser</button><button id="load">Load browser save</button><button id="export">Export project</button><label>Import <input id="import" type="file" accept="application/json,.json"></label><button id="png">Export PNG</button>
<p id="status" role="status">Draw on the canvas. Changes are saved only when you choose Save or Export.</p><canvas id="board" width="1200" height="800" aria-label="Layered drawing canvas"></canvas><script type="module" src="/app.js"></script></html>
